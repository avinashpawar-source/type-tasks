
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeTasks</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <h1>TypeTasks</h1>
    <p class="subtitle">Small steps. Big progress.</p>

    <form id="task-form">
      <label for="task-title">What do you need to do?</label>

      <input
        id="task-title"
        type="text"
        placeholder="e.g. Learn TypeScript"
        required
      >

      <label for="task-status">Choose a status</label>
      <select id="task-status">
        <option value="todo">To do</option>
        <option value="in-progress">In progress</option>
        <option value="done">Done</option>
      </select>

      <button type="submit">Add task</button>
    </form>

    <label for="filter-status">Show tasks:</label>
    <select id="filter-status">
      <option value="all">All tasks</option>
      <option value="todo">To do</option>
      <option value="in-progress">In progress</option>
      <option value="done">Done</option>
    </select>

    <p id="task-count">Tasks: 0</p>
    <ul id="task-list"></ul>
  </main>

  <script type="module" src="./dist/app.js"></script>
</body>
</html>
